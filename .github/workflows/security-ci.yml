name: Security and confidentiality

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'security/**'
      - 'feature/ai-explorations'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confidentiality:
    name: Confidentiality and source verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official tag verified
        with:
          persist-credentials: false
      - name: Run repository secret and sensitive-file gate
        run: python3 scripts/ai_security_preflight.py --tracked
      - name: Test security gate
        run: python3 -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Test CMS and confidentiality controls
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify site build
        run: python3 scripts/build.py
      - name: Verify no unintended build changes
        run: git diff --exit-code -- dist

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out reviewed commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 official tag verified
        with:
          languages: javascript-typescript,python
          queries: security-extended
      - name: Analyze code
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  gitleaks:
    name: Gitleaks history and PR scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
